<style>
    enhanced * {
        transition: 0.5s;
    }

    enhanced {
        --blur: 1.5rem;
        --background: rgba(255, 255, 255, 0.1);

        transition: 0.5s;
        z-index: 9999;
        position: fixed;
        width: 24rem;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 2rem;
        background: var(--background);
        border-radius: 1rem;
        padding: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.4);
        font-family: 'Nunito', sans-serif;
        padding-bottom: 3rem;
        overflow: hidden;
    }

    enhanced::before {
        z-index: -1;
        content: "";
        backdrop-filter: blur(var(--blur));
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 1rem;
    }

    enhanced .container {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    enhanced .container span.part-title {
        padding-bottom: 0.5rem;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 500;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    enhanced .container span.part-title svg {
        color: rgba(255, 255, 255, 0.7);
        width: 1.8rem;
        height: 1.8rem;
        cursor: pointer;
        background-color: rgba(255, 255, 255, 0);
        border-radius: 50%;
        padding: 0.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    enhanced .container span.part-title svg:hover {
        transition: 0.2s;
        color: rgba(255, 255, 255, 1);
        background-color: rgba(255, 255, 255, 0.2);
    }

    enhanced #dropbox {
        transition: 0.5s;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 1rem;
        padding: 1rem;
        font-weight: 500;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.5);
        background-color: rgba(255, 255, 255, 0);
    }

    enhanced #dropbox:hover {
        transition: 0.1s;
        background-color: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0);
        color: rgba(255, 255, 255, 0.7);
    }

    enhanced #dropbox:hover svg {
        transition: 0.1s;
        color: rgba(255, 255, 255, 0.7);
    }

    enhanced #dropbox svg {
        width: 4rem;
        height: 4rem;
        color: rgba(255, 255, 255, 0.5);
    }

    enhanced #dropbox input[type="file"] {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        border-radius: 1rem;
        cursor: pointer;
    }

    enhanced .container span#actual-link {
        color: rgba(255, 255, 255, 0.8);
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 1rem;
        font-size: 0.9rem;
    }

    enhanced .container span#actual-link a {
        color: rgba(255, 255, 255, 0.75);
    }

    enhanced .container .en-slider {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
    }

    enhanced .container .en-slider div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
    }

    enhanced .container .en-slider span {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        font-weight: 500;
    }

    enhanced .container .en-slider div label {
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.8rem;
        font-weight: 600;
        display: grid;
        align-items: center;
        justify-items: center;
    }

    enhanced .container .en-slider input[type="range"] {
        position: relative;
        --value: 30%;
        width: 10rem;
        height: 24px;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        cursor: pointer;
    }

    enhanced .container .en-slider input[type="range"]::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% - 34px);
        height: 8px;
        border-radius: 8px;
        background: linear-gradient(to right,
                #ffffff 0 var(--value),
                rgba(255, 255, 255, 0.2) var(--value) 100%);
    }

    enhanced .container .en-slider input[type="range"]#opacity::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% - 34px);
        height: 8px;
        border-radius: 8px;
        background: linear-gradient(to right, black, white 100%);
    }

    enhanced .container .en-slider input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 8px;
        background: transparent;
    }

    enhanced .container .en-slider input[type="range"]::-webkit-slider-thumb {
        transition: 0.4s;
        width: 32px;
        height: 22px;
        margin-top: -7px;
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 2px 6px rgb(0 0 0 / 30%);
        backdrop-filter: blur(0.25rem);
    }

    enhanced .container .en-slider input[type="range"]:active::-webkit-slider-thumb {
        transition: 0.1s;
        background: rgba(255, 255, 255, 1);
        border: 1px solid rgba(255, 255, 255, 0);
        transform: scale(1.2);
    }
</style>
